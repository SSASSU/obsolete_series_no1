appId: com.obsolete-series.no1
productName: obsolete_series_no1
directories:
  buildResources: resources
  output: dist-electron

extraMetadata:
  main: dist/main/index.js

files:
  - dist/**/*
  - '!dist/renderer/characters/**'
  - assets/*.gif
  - assets/icons/**/*
  - '!src/**/*'
  - '!electron.vite.config.*'

win:
  icon: resources/icon.ico
  target:
    - target: msi
      arch: x64
    - target: portable
      arch: x64

msi:
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true

mac:
  icon: assets/icons/app/peeking-1024.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64

afterPack: scripts/afterPack.js

# publish는 .github/workflows/release.yml 의 softprops/action-gh-release 에서 처리
# (electron-builder 의 GitHub publish 와 동시 사용 시 token 권한 충돌 발생)
