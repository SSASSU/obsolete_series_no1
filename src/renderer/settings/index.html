<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #16213e;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      border-bottom: 1px solid #0f3460;
    }
    header h1 { font-size: 15px; font-weight: 600; }
    #close-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 18px;
      -webkit-app-region: no-drag;
      padding: 0 4px;
    }
    #close-btn:hover { color: #fff; }

    .content { padding: 20px; flex: 1; overflow-y: auto; }
    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7f8cc4;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    label { font-size: 13px; color: #ccc; }

    /* Toggle */
    .toggle { position: relative; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: #444;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle input:checked + .toggle-track { background: #5c6bc0; }
    .toggle-track::after {
      content: '';
      position: absolute;
      left: 3px; top: 3px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-track::after { transform: translateX(18px); }

    /* Select */
    select, input[type=range] {
      background: #0f3460;
      border: 1px solid #1a4a8a;
      color: #e0e0e0;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
    }
    select { cursor: pointer; }
    input[type=range] { width: 140px; cursor: pointer; accent-color: #5c6bc0; }

    /* Position grid */
    .pos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .pos-btn {
      background: #0f3460;
      border: 1px solid #1a4a8a;
      color: #ccc;
      border-radius: 6px;
      padding: 8px;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
      transition: background 0.15s;
    }
    .pos-btn.active, .pos-btn:hover { background: #5c6bc0; color: #fff; border-color: #5c6bc0; }
  </style>
</head>
<body>
  <header>
    <h1>⌨️ obsolete_series_no1 설정</h1>
    <button id="close-btn">✕</button>
  </header>
  <div class="content">
    <div class="section">
      <div class="section-title">밈 선택</div>
      <div class="row">
        <label>캐릭터</label>
        <select id="meme-select"></select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">동작</div>
      <div class="row">
        <label>화면에 표시</label>
        <label class="toggle">
          <input type="checkbox" id="toggle-enabled" />
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="row">
        <label>Windows 시작 시 자동 실행</label>
        <label class="toggle">
          <input type="checkbox" id="toggle-autostart" />
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">위치</div>
      <div class="pos-grid">
        <button class="pos-btn" data-pos="top-left">↖ 좌상단</button>
        <button class="pos-btn" data-pos="top-right">↗ 우상단</button>
        <button class="pos-btn" data-pos="bottom-left">↙ 좌하단</button>
        <button class="pos-btn" data-pos="bottom-right">↘ 우하단</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">외관</div>
      <div class="row">
        <label>크기 <span id="size-val"></span>px</label>
        <input type="range" id="size-range" min="60" max="200" step="10" />
      </div>
      <div class="row">
        <label>투명도 <span id="opacity-val"></span>%</label>
        <input type="range" id="opacity-range" min="20" max="100" step="5" />
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
