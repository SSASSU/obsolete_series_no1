<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #181818;
      --surface: #242424;
      --border:  #303030;
      --accent:  #FF6600;
      --text:    #FFFFFF;
      --muted:   #777777;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 46px;
      border-bottom: 2px solid var(--accent);
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    .title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text);
    }
    #close-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      -webkit-app-region: no-drag;
      padding: 6px 8px;
      line-height: 1;
      transition: color 0.1s;
    }
    #close-btn:hover { color: var(--accent); }

    /* ── Content ─────────────────────────────────── */
    .content { flex: 1; overflow-y: auto; }

    .section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .section:last-child { border-bottom: none; }

    .section-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    /* ── Row ─────────────────────────────────────── */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 30px;
      margin-bottom: 6px;
    }
    .row:last-child { margin-bottom: 0; }

    .row-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ── Toggle ──────────────────────────────────── */
    .toggle {
      position: relative;
      width: 38px;
      height: 20px;
      display: inline-block;
      cursor: pointer;
    }
    .toggle input { display: none; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      transition: background 0.15s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 4px;
      width: 12px;
      height: 12px;
      background: var(--muted);
      transition: transform 0.15s, background 0.15s;
    }
    .toggle input:checked + .toggle-track { background: var(--accent); }
    .toggle input:checked + .toggle-track::after {
      transform: translateX(18px);
      background: var(--text);
    }

    /* ── Select ──────────────────────────────────── */
    select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      min-width: 130px;
    }
    select:focus { border-color: var(--accent); }

    /* ── Range ───────────────────────────────────── */
    .range-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .range-val {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: var(--text);
      min-width: 38px;
      text-align: right;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 110px;
      height: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: var(--accent);
      cursor: pointer;
    }
    input[type=range]:focus { outline: none; }

    /* ── Position grid ───────────────────────────── */
    .pos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .pos-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 9px 0;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      letter-spacing: 0.04em;
      transition: border-color 0.1s, color 0.1s, background 0.1s;
    }
    .pos-btn:hover { border-color: var(--accent); color: var(--text); }
    .pos-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text);
    }

    /* ── Hotkey ──────────────────────────────────── */
    .hotkey-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 30px;
    }
    .hotkey-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hotkey-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      cursor: pointer;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.06em;
      min-width: 130px;
      text-align: center;
      transition: border-color 0.15s, color 0.15s;
    }
    .hotkey-btn:hover { border-color: var(--accent); }
    .hotkey-btn.capturing {
      border-color: var(--accent);
      color: var(--accent);
      animation: blink-border 0.7s ease-in-out infinite;
    }
    @keyframes blink-border {
      0%, 100% { border-color: var(--accent); }
      50%       { border-color: #555; }
    }
    .hotkey-clear {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 9px;
      font-family: inherit;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 8px;
      transition: color 0.1s, border-color 0.1s;
    }
    .hotkey-clear:hover { color: var(--accent); border-color: var(--border); }
    .hotkey-hint {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-top: 8px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <span class="title">Obsolete Series No.1</span>
    <button id="close-btn">&#x2715;</button>
  </header>

  <div class="content">

    <div class="section">
      <div class="section-label">Character</div>
      <div class="row">
        <span class="row-label">밈</span>
        <select id="meme-select"></select>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Display</div>
      <div class="row">
        <span class="row-label">화면에 표시</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-enabled" />
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="row">
        <span class="row-label">시작 시 자동 실행</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-autostart" />
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Position</div>
      <div class="pos-grid">
        <button class="pos-btn" data-pos="top-left">&#x2196; 좌상단</button>
        <button class="pos-btn" data-pos="top-right">&#x2197; 우상단</button>
        <button class="pos-btn" data-pos="bottom-left">&#x2199; 좌하단</button>
        <button class="pos-btn" data-pos="bottom-right">&#x2198; 우하단</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Appearance</div>
      <div class="row">
        <span class="row-label">크기</span>
        <div class="range-group">
          <span class="range-val" id="size-val"></span>
          <input type="range" id="size-range" min="60" max="200" step="10" />
        </div>
      </div>
      <div class="row">
        <span class="row-label">투명도</span>
        <div class="range-group">
          <span class="range-val" id="opacity-val"></span>
          <input type="range" id="opacity-range" min="20" max="100" step="5" />
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Shortcuts</div>
      <div class="hotkey-row">
        <span class="row-label">숨김 토글</span>
        <div class="hotkey-controls">
          <button class="hotkey-clear" id="hotkey-clear">Clear</button>
          <button class="hotkey-btn" id="hotkey-btn">없음</button>
        </div>
      </div>
      <div class="hotkey-hint">버튼 클릭 후 키 조합 입력 &nbsp;/&nbsp; ESC 취소</div>
    </div>

  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
